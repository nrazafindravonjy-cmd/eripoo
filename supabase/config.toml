# Supabase LOCAL stack only (CLI: `supabase start`), used by developers and
# by CI. Not the development or production projects, which are configured
# in their own dashboards. Contains no secret: local keys are generated by
# the CLI and are the same public defaults for everyone.
project_id = "eripoo-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[db.seed]
# No seed data: tests create their own fictitious users.
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
# Contract tests create many fictitious users from one address.
sign_in_sign_ups = 1000
token_refresh = 1000

[auth.email]
enable_signup = true
# Local only: no mail is sent, accounts are usable immediately.
enable_confirmations = false
