include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - lib/l10n/generated/**
    - "**/*.g.dart"
    - web/**

linter:
  rules:
    # Logging goes through the redacting logger (docs/SECURITY.md), never print.
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - always_declare_return_types
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - require_trailing_commas
