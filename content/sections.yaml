# Project sections shown on the Project screen (docs/PRODUCT_ARCHITECTURE.md
# §7). Step outputs may only write declared fields (checked at build).
- key: problem
  title: {fr: "Le problème", en: "The problem"}
  fields:
    - key: statement
      label: {fr: "Le problème observé", en: "The problem observed"}
      max_length: 280
    - key: causes
      label: {fr: "Pourquoi il arrive", en: "Why it happens"}
      max_length: 300
    - key: effects
      label: {fr: "Ce qu'il coûte aux gens", en: "What it costs people"}
      max_length: 300
# The activity as it is today (journey C, quest q16): for people who
# already sell. Their own figures, never computed by Eripoo.
- key: activity
  title: {fr: "Mon activité aujourd'hui", en: "My activity today"}
  fields:
    - key: what
      label: {fr: "Ce que je vends", en: "What I sell"}
      max_length: 280
    - key: customers
      label: {fr: "À qui", en: "To whom"}
      max_length: 200
    - key: volume
      label: {fr: "Combien par semaine", en: "How much per week"}
      max_length: 200
    - key: works
      label: {fr: "Ce qui marche le mieux", en: "What works best"}
      max_length: 280
    - key: hard
      label: {fr: "Ce qui est le plus difficile", en: "What is hardest"}
      max_length: 280
# The desire (quest q01, "desire" door): a business can start from what
# people want for pleasure, pride or a celebration, not only from a problem.
- key: desire
  title: {fr: "L'envie", en: "The desire"}
  fields:
    - key: what
      label: {fr: "L'envie que tu satisfais", en: "The desire you meet"}
      max_length: 280
    - key: occasion
      label: {fr: "À quelle occasion", en: "On what occasion"}
      max_length: 200
    - key: special
      label: {fr: "Ce qui rend ton offre spéciale", en: "What makes your offer special"}
      max_length: 280
    - key: today
      label: {fr: "Ce qu'ils achètent déjà pour se faire plaisir", en: "What they already buy to treat themselves"}
      max_length: 280
- key: customers
  title: {fr: "Les clients", en: "The customers"}
  fields:
    - key: first_guess
      label: {fr: "Qui vit le problème", en: "Who has the problem"}
      max_length: 200
    - key: description
      label: {fr: "Le client cible", en: "The target customer"}
      max_length: 280
    - key: where_to_meet
      label: {fr: "Où le rencontrer", en: "Where to meet them"}
      max_length: 200
    - key: interview_learnings
      label: {fr: "Ce que les rencontres ont appris", en: "What the conversations taught"}
      max_length: 400
    - key: says
      label: {fr: "Ce qu'ils disent", en: "What they say"}
      max_length: 300
    - key: does
      label: {fr: "Ce qu'ils font aujourd'hui", en: "What they do today"}
      max_length: 300
    - key: feels
      label: {fr: "Ce qu'ils ressentent", en: "What they feel"}
      max_length: 300
    - key: lacks
      label: {fr: "Ce qui les gêne ou leur manque", en: "What bothers them or is missing"}
      max_length: 300
- key: solution
  title: {fr: "La solution", en: "The solution"}
  fields:
    - key: first_idea
      label: {fr: "Première idée de solution", en: "First solution idea"}
      max_length: 300
    - key: advantage
      label: {fr: "Ce qui est mieux qu'aujourd'hui", en: "What is better than today"}
      max_length: 200
    - key: gains
      label: {fr: "Ce que le client y gagne", en: "What the customer gains"}
      max_length: 300
    - key: relieves
      label: {fr: "La gêne ou le manque que tu enlèves", en: "The trouble or lack you remove"}
      max_length: 300
# The market (quest q05): what the user saw and estimated, with how they
# know it. No figure is given by Eripoo (docs/NEXT_STEPS.md C-6).
- key: market
  title: {fr: "Le marché", en: "The market"}
  fields:
    - key: customers
      label: {fr: "Les clients possibles", en: "The possible customers"}
      max_length: 280
    - key: area
      label: {fr: "Où ils sont (quartier, ville, région)", en: "Where they are (neighbourhood, town, region)"}
      max_length: 200
    - key: estimate
      label: {fr: "Ton estimation de leur nombre", en: "Your estimate of how many there are"}
      max_length: 200
    - key: how_known
      label: {fr: "Comment tu le sais", en: "How you know"}
      max_length: 300
# Strengths and weaknesses (quest q05), asked as four plain questions.
- key: swot
  title: {fr: "Tes forces et tes risques", en: "Your strengths and risks"}
  fields:
    - key: strengths
      label: {fr: "Ce que tu fais mieux que les autres", en: "What you do better than others"}
      max_length: 300
    - key: weaknesses
      label: {fr: "Ce qui te manque", en: "What you lack"}
      max_length: 300
    - key: opportunities
      label: {fr: "Ce qui pourrait t'aider", en: "What could help you"}
      max_length: 300
    - key: threats
      label: {fr: "Ce qui pourrait te gêner", en: "What could get in your way"}
      max_length: 300
# Costs and prices of an existing activity (quest q19).
- key: pricing
  title: {fr: "Mes coûts et mes prix", en: "My costs and prices"}
  fields:
    - key: product
      label: {fr: "Le produit étudié", en: "The product studied"}
      max_length: 200
    - key: unit_cost
      label: {fr: "Ce qu'il me coûte", en: "What it costs me"}
      max_length: 200
    - key: price
      label: {fr: "Mon prix de vente", en: "My selling price"}
      max_length: 100
    - key: decision
      label: {fr: "Ce que je décide", en: "What I decide"}
      max_length: 280
# Stock (quest q21): what sells most, what sleeps, when to buy again.
- key: stock
  title: {fr: "Mes achats et mon stock", en: "My purchases and stock"}
  fields:
    - key: best
      label: {fr: "Ce qui rapporte le plus", en: "What earns the most"}
      max_length: 280
    - key: slow
      label: {fr: "Ce qui dort dans le stock", en: "What sleeps in stock"}
      max_length: 280
    - key: rule
      label: {fr: "Quand je rachète", en: "When I buy again"}
      max_length: 280
# The next six months (quest q23).
- key: plan
  title: {fr: "Mon plan pour la suite", en: "My plan for what comes next"}
  fields:
    - key: goal
      label: {fr: "Mon objectif à six mois", en: "My six-month goal"}
      max_length: 200
    - key: measure
      label: {fr: "Comment je saurai qu'il est atteint", en: "How I will know it is reached"}
      max_length: 200
    - key: who
      label: {fr: "Qui s'en occupe", en: "Who takes care of it"}
      max_length: 200
    - key: priorities
      label: {fr: "Mes trois actions prioritaires", en: "My three priority actions"}
      max_length: 400
# The offer (quest q06): what is sold, how it is received, at what price.
- key: offer
  title: {fr: "L'offre", en: "The offer"}
  fields:
    - key: what
      label: {fr: "Ce que tu vends, et en quelle quantité", en: "What you sell, and in what quantity"}
      max_length: 280
    - key: delivery
      label: {fr: "Comment le client le reçoit", en: "How the customer gets it"}
      max_length: 200
    - key: price
      label: {fr: "Le prix envisagé", en: "The price considered"}
      max_length: 100
# Phase 7: sections brought by a tool. They appear once the tool is
# unlocked (or as soon as they hold something), never as empty boxes.
- key: business_model
  tool: tool.business_model_canvas
  title: {fr: "Le modèle économique", en: "The business model"}
  fields:
    - key: channels
      label: {fr: "Comment tes clients te trouvent et achètent", en: "How customers find you and buy"}
      max_length: 300
    - key: relationships
      label: {fr: "Comment tu gardes tes clients", en: "How you keep your customers"}
      max_length: 300
    - key: resources
      label: {fr: "Ce qu'il te faut pour produire", en: "What you need to produce"}
      max_length: 300
    - key: activities
      label: {fr: "Ce que tu fais chaque semaine", en: "What you do every week"}
      max_length: 300
    - key: partners
      label: {fr: "Qui t'aide (fournisseurs, partenaires)", en: "Who helps you (suppliers, partners)"}
      max_length: 300
- key: marketing
  tool: tool.marketing_plan
  title: {fr: "Le plan marketing", en: "The marketing plan"}
  fields:
    - key: target
      label: {fr: "À qui tu parles en premier", en: "Who you talk to first"}
      max_length: 200
    - key: message
      label: {fr: "Ce que tu leur dis, en une phrase", en: "What you tell them, in one sentence"}
      max_length: 200
    - key: channels
      label: {fr: "Où ils entendront parler de toi", en: "Where they will hear about you"}
      max_length: 300
    - key: first_actions
      label: {fr: "Tes trois premières actions", en: "Your first three actions"}
      max_length: 400
    - key: budget
      label: {fr: "Ce que tu peux y consacrer (temps, argent)", en: "What you can put into it (time, money)"}
      max_length: 200
- key: pitch
  tool: tool.pitch
  title: {fr: "Le pitch", en: "The pitch"}
  fields:
    - key: hook
      label: {fr: "Une phrase pour accrocher", en: "One sentence to catch attention"}
      max_length: 200
    - key: problem
      label: {fr: "Le problème, avec un fait observé", en: "The problem, with an observed fact"}
      max_length: 300
    - key: solution
      label: {fr: "Ta solution, simplement", en: "Your solution, simply"}
      max_length: 300
    - key: proof
      label: {fr: "Ta preuve (ce que tes tests ont montré)", en: "Your proof (what your tests showed)"}
      max_length: 300
    - key: ask
      label: {fr: "Ce que tu demandes", en: "What you are asking for"}
      max_length: 200
- key: vision
  tool: tool.business_plan
  title: {fr: "Le résumé du projet", en: "The project summary"}
  fields:
    - key: summary
      label: {fr: "Ton projet en quelques phrases", en: "Your project in a few sentences"}
      max_length: 600
- key: launch
  tool: tool.business_plan
  title: {fr: "Le lancement", en: "The launch"}
  fields:
    - key: first_steps
      label: {fr: "Les premières étapes, dans l'ordre", en: "The first steps, in order"}
      max_length: 500
    - key: when
      label: {fr: "Quand tu veux commencer", en: "When you want to start"}
      max_length: 100
    - key: goal
      label: {fr: "L'objectif du premier mois", en: "The first month's goal"}
      max_length: 200
    - key: goal_measure
      label: {fr: "Comment tu sauras qu'il est atteint", en: "How you will know it is reached"}
      max_length: 200
    - key: goal_who
      label: {fr: "Qui s'en occupe", en: "Who takes care of it"}
      max_length: 200
# Phase 8: brought by the administrative preparation tool. What the user
# collects for the counter; nothing is filed by Eripoo.
- key: formalization
  tool: tool.admin_preparation
  title: {fr: "Ma préparation administrative", en: "My administrative preparation"}
  fields:
    - key: business_name
      label: {fr: "Nom envisagé pour l'entreprise", en: "Name considered for the business"}
      max_length: 120
    - key: form_considered
      label: {fr: "Forme envisagée (à confirmer au guichet)", en: "Form considered (to confirm at the counter)"}
      max_length: 120
    - key: activity
      label: {fr: "Activité principale, en une phrase", en: "Main activity, in one sentence"}
      max_length: 200
    - key: premises
      label: {fr: "Où tu exerceras (adresse, Fokontany)", en: "Where you will work (address, Fokontany)"}
      max_length: 200
    - key: partners
      label: {fr: "Associés éventuels et leur rôle", en: "Possible partners and their role"}
      max_length: 300
    - key: questions
      label: {fr: "Tes questions pour le guichet", en: "Your questions for the counter"}
      max_length: 500
