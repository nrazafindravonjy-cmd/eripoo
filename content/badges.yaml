# Badges (CLAUDE.md §21; docs/PRODUCT_ARCHITECTURE.md §8). They reward
# what the user DID: going into the field, testing, concluding honestly,
# selling. Never reading alone (rejected by the validator), no ranking,
# no streak. Earned once, never taken back. Rules count records by
# status or kind, never by what the user wrote.
# DRAFT texts (see pack.yaml default_status).
- id: badge.first_observation
  title: {fr: "Œil ouvert", en: "Open eye"}
  description:
    fr: "Tu as noté ce que tu as vu sur le terrain. Les bonnes idées partent de là."
    en: "You wrote down what you saw in the field. Good ideas start there."
  hint:
    fr: "Note une première observation dans le journal d'observation."
    en: "Write a first observation in the observation journal."
  earned_when: {count: observations, gte: 1}
- id: badge.first_mission
  title: {fr: "Sur le terrain", en: "In the field"}
  description:
    fr: "Tu as terminé une mission dans le monde réel, hors de l'application."
    en: "You finished a mission in the real world, outside the app."
  hint:
    fr: "Termine une première mission."
    en: "Finish a first mission."
  earned_when: {count: missions, where: {status: completed}, gte: 1}
- id: badge.good_listener
  title: {fr: "À l'écoute", en: "Good listener"}
  description:
    fr: "Cinq rencontres : tu connais tes clients mieux que la plupart des débutants."
    en: "Five conversations: you know your customers better than most beginners."
  hint:
    fr: "Note cinq rencontres dans le carnet de terrain."
    en: "Record five conversations in the field notebook."
  earned_when: {count: interviews, gte: 5}
- id: badge.first_test
  title: {fr: "Expérimentateur", en: "Experimenter"}
  description:
    fr: "Tu as mené un test jusqu'au bout au lieu de supposer."
    en: "You ran a test to the end instead of assuming."
  hint:
    fr: "Termine un premier test d'hypothèse."
    en: "Finish a first hypothesis test."
  earned_when: {count: experiments, where: {status: done}, gte: 1}
- id: badge.truth_seeker
  title: {fr: "Chercheur de vérité", en: "Truth seeker"}
  description:
    fr: "Tu as reconnu qu'une hypothèse était fausse. C'est une vraie réussite : tu as évité une erreur coûteuse."
    en: "You admitted a hypothesis was wrong. That is a real success: you avoided a costly mistake."
  hint:
    fr: "Conclus honnêtement une hypothèse que le terrain a infirmée."
    en: "Honestly conclude a hypothesis the field disproved."
  earned_when: {count: hypotheses, where: {status: invalidated}, gte: 1}
- id: badge.proof_in_hand
  title: {fr: "Preuve en main", en: "Proof in hand"}
  description:
    fr: "Une hypothèse confirmée par le terrain, avec ses preuves."
    en: "A hypothesis confirmed in the field, with its evidence."
  hint:
    fr: "Valide une hypothèse avec au moins une preuve."
    en: "Validate a hypothesis with at least one piece of evidence."
  earned_when: {count: hypotheses, where: {status: validated}, gte: 1}
- id: badge.clear_eyed
  title: {fr: "Regard lucide", en: "Clear-eyed"}
  description:
    fr: "Trois concurrents analysés : tu sais ce que tes clients choisissent aujourd'hui."
    en: "Three competitors analysed: you know what your customers choose today."
  hint:
    fr: "Note trois concurrents dans l'analyse concurrentielle."
    en: "Note three competitors in the competitor analysis."
  earned_when: {count: competitors, gte: 3}
- id: badge.first_sale
  title: {fr: "Première vente", en: "First sale"}
  description:
    fr: "Quelqu'un a payé pour ce que tu proposes. Ton projet existe pour de vrai."
    en: "Someone paid for what you offer. Your project exists for real."
  hint:
    fr: "Ajoute une preuve de type « Vente »."
    en: "Add a \"Sale\" piece of evidence."
  earned_when: {count: evidences, where: {kind: sale}, gte: 1}
