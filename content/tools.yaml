      en: "They reuse your pitch and figures; nothing is invented."
  unlock:
    all:
      - {quest: q04, is: completed}
      - {count: hypotheses, where: {status: validated}, gte: 1}
  unlock_hint:
    fr: "Se débloque après « Tester ta première hypothèse », avec une hypothèse confirmée."
    en: "Unlocks after \"Test your first hypothesis\", with a confirmed hypothesis."
- id: tool.admin_preparation
  kind: admin_preparation
  title: {fr: "Préparation administrative", en: "Administrative preparation"}
  summary:
