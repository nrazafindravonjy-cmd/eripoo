# Tools of the Tools tab (CLAUDE.md §20), unlocked progressively by rules
# on what the user has DONE (never on reading alone). Help is readable
# before unlocking. Tools the app cannot open yet (formalisation, Phase
# 8) are listed as announced, never imitated.
# DRAFT texts (see pack.yaml default_status).
- id: tool.observation_journal
  kind: observation_journal
  title: {fr: "Journal d'observation", en: "Observation journal"}
  summary:
    fr: "Note ce que tu vois sur le terrain, au moment où tu le vois."
    en: "Write down what you see in the field, when you see it."
  help:
    - fr: "Une observation décrit un fait : qui, où, quoi. Pas encore ton avis."
      en: "An observation describes a fact: who, where, what. Not your opinion yet."
    - fr: "Ajoute une photo comme preuve si c'est utile, sans visage reconnaissable."
      en: "Add a photo as evidence if useful, without recognisable faces."
  unlock: {quest: diag, is: completed}
  unlock_hint:
    fr: "Se débloque à la fin de « Faisons connaissance »."
    en: "Unlocks at the end of \"Let's get to know each other\"."
- id: tool.interview_guide
  kind: interview_guide
  title: {fr: "Guide d'interview", en: "Interview guide"}
  summary:
    fr: "Les bonnes questions pour comprendre quelqu'un sans lui vendre ton idée."
    en: "The right questions to understand someone without selling them your idea."
  help:
    - fr: "Pose des questions sur ce que la personne a fait, pas sur ce qu'elle ferait."
      en: "Ask about what the person did, not what they would do."
    - fr: "Après chaque rencontre, note-la dans le carnet de terrain, sous un surnom."
      en: "After each conversation, write it in the field notebook, under a nickname."
  unlock:
    any:
      - {count: observations, gte: 1}
      - {quest: q02, is: [in_progress, completed]}
  unlock_hint:
    fr: "Se débloque avec ta première observation, ou en commençant « Comprendre tes futurs clients »."
    en: "Unlocks with your first observation, or when you start \"Understand your future customers\"."
  guide:
    - title: {fr: "Avant", en: "Before"}
      items:
        - fr: "Choisis quelqu'un qui vit le problème, pas un ami qui veut te faire plaisir."
          en: "Pick someone who lives the problem, not a friend who wants to please you."
        - fr: "Demande son accord pour parler cinq à dix minutes. N'enregistre personne."
          en: "Ask if they agree to talk for five to ten minutes. Don't record anyone."
    - title: {fr: "Pendant : les questions", en: "During: the questions"}
      items:
        - fr: "« Raconte-moi la dernière fois que cela t'est arrivé. »"
          en: "\"Tell me about the last time this happened to you.\""
        - fr: "« Qu'as-tu fait pour t'en sortir ? Combien cela t'a coûté ? »"
          en: "\"What did you do about it? How much did it cost you?\""
        - fr: "« Qu'est-ce qui est le plus pénible dans tout ça ? »"
          en: "\"What is the most painful part of it?\""
        - fr: "« À qui d'autre devrais-je parler ? »"
          en: "\"Who else should I talk to?\""
    - title: {fr: "À éviter", en: "To avoid"}
      items:
        - fr: "« Est-ce que tu achèterais… ? » : les gens répondent souvent oui par politesse."
          en: "\"Would you buy…?\": people often say yes to be polite."
        - fr: "Présenter ton idée avant la fin : la personne parlera de ton idée, plus de sa vie."
          en: "Presenting your idea before the end: they will talk about your idea, not their life."
    - title: {fr: "Après", en: "After"}
      items:
        - fr: "Note tout de suite ce que tu as appris, sous un surnom, sans nom ni numéro de téléphone."
          en: "Write down at once what you learned, under a nickname, with no name or phone number."
        - fr: "Une phrase qui t'a surpris vaut plus que dix compliments."
          en: "One sentence that surprised you is worth more than ten compliments."
- id: tool.hypotheses
  kind: hypotheses
  title: {fr: "Hypothèses", en: "Hypotheses"}
  summary:
    fr: "Ce que tu crois vrai mais que tu n'as pas encore vérifié."
    en: "What you believe but have not checked yet."
  help:
    - fr: "Écris-les sous la forme « Je pense que… », puis teste d'abord celle dont le projet dépend le plus."
      en: "Write them as \"I think that…\", then test first the one your project depends on most."
  unlock: {quest: q01, is: completed}
  unlock_hint:
    fr: "Se débloque à la fin de « Trouver ce qui compte pour tes clients »."
    en: "Unlocks at the end of \"Find what matters to your customers\"."
- id: tool.experiments
  kind: experiments
  title: {fr: "Expériences", en: "Experiments"}
  summary:
    fr: "Des petits tests réels pour savoir si une hypothèse tient."
    en: "Small real tests to find out whether a hypothesis holds."
  help:
    - fr: "Avant de commencer, écris ce qui voudra dire « réussi ». Tu ne pourras plus le changer pendant le test."
      en: "Before starting, write what will mean \"success\". You cannot change it during the test."
  unlock: {count: hypotheses, gte: 1}
  unlock_hint:
    fr: "Se débloque avec ta première hypothèse."
    en: "Unlocks with your first hypothesis."
- id: tool.competitor_analysis
  kind: competitor_analysis
  title: {fr: "Analyse concurrentielle", en: "Competitor analysis"}
  summary:
    fr: "Ce que les gens utilisent déjà aujourd'hui, et pourquoi."
    en: "What people already use today, and why."
  help:
    - fr: "Un concurrent n'est pas seulement une boutique comme la tienne : c'est aussi ce que les gens font déjà (le voisin, le marché, faire soi-même, ne rien faire)."
      en: "A competitor is not only a shop like yours: it is also what people already do (the neighbour, the market, doing it themselves, doing nothing)."
    - fr: "Note ce que tu as vu ou entendu, pas ce que tu imagines. Un prix observé vaut mieux qu'un prix supposé."
      en: "Note what you saw or heard, not what you imagine. An observed price beats a guessed one."
  unlock:
    any:
      - {count: interviews, gte: 2}
      - {quest: q03, is: [in_progress, completed]}
  unlock_hint:
    fr: "Se débloque après deux rencontres, ou en commençant « Imaginer ta solution »."
    en: "Unlocks after two conversations, or when you start \"Imagine your solution\"."
- id: tool.business_model_canvas
  kind: business_model_canvas
  title: {fr: "Business Model Canvas", en: "Business Model Canvas"}
  summary:
    fr: "La synthèse de ton projet, construite à partir de ton travail."
    en: "The summary of your project, built from your work."
  help:
    - fr: "Il se remplit au fil des quêtes : aucune case n'est inventée pour toi."
      en: "It fills in as you go through the quests: no box is invented for you."
  unlock: {count: experiments, where: {status: done}, gte: 1}
  unlock_hint:
    fr: "Se débloque quand tu as terminé un premier test."
    en: "Unlocks when you have finished a first test."
- id: tool.price_calculator
  kind: price_calculator
  title: {fr: "Calculateur de prix", en: "Price calculator"}
  summary:
    fr: "Trouver un prix qui couvre tes coûts et que tes clients acceptent, en ariary."
    en: "Find a price that covers your costs and that customers accept, in ariary."
  help:
    - fr: "Pars de ce que tu paies vraiment et des prix que tu as observés."
      en: "Start from what you really pay and the prices you have observed."
  unlock: {count: competitors, gte: 1}
  unlock_hint:
    fr: "Se débloque avec un premier concurrent noté."
    en: "Unlocks with a first competitor noted."
- id: tool.margin_calculator
  kind: margin_calculator
  title: {fr: "Calculateur de marge", en: "Margin calculator"}
  summary:
    fr: "Ce qui te reste vraiment sur chaque vente."
    en: "What you really keep on each sale."
  help:
    - fr: "Marge = prix de vente − ce que te coûte ce que tu vends."
      en: "Margin = selling price − what what you sell costs you."
  unlock: {count: hypotheses, where: {status: validated}, gte: 1}
  unlock_hint:
    fr: "Se débloque quand une hypothèse est confirmée."
    en: "Unlocks when a hypothesis is confirmed."
- id: tool.break_even_calculator
  kind: break_even_calculator
  title: {fr: "Seuil de rentabilité", en: "Break-even point"}
  summary:
    fr: "Combien vendre pour couvrir toutes tes charges."
    en: "How much to sell to cover all your costs."
  help:
    - fr: "Il faut d'abord connaître ta marge et tes charges du mois."
      en: "You first need your margin and your monthly costs."
  unlock:
    all:
      - {count: hypotheses, where: {status: validated}, gte: 1}
      - {count: competitors, gte: 1}
  unlock_hint:
    fr: "Se débloque avec une hypothèse confirmée et un concurrent noté."
    en: "Unlocks with a confirmed hypothesis and a competitor noted."
- id: tool.marketing_plan
  kind: marketing_plan
  title: {fr: "Plan marketing", en: "Marketing plan"}
  summary:
    fr: "Comment tes clients vont entendre parler de toi, et à quel coût."
    en: "How your customers will hear about you, and at what cost."
  help:
    - fr: "Il part de ce que tes rencontres t'ont appris : où sont tes clients, à qui ils font confiance."
      en: "It starts from what your conversations taught you: where your customers are, whom they trust."
  unlock: {count: interviews, gte: 5}
  unlock_hint:
    fr: "Se débloque après cinq rencontres."
    en: "Unlocks after five conversations."
- id: tool.business_plan
  kind: business_plan
  title: {fr: "Business plan", en: "Business plan"}
  summary:
    fr: "Ton dossier, assemblé à partir de tout ce que tu as fait."
    en: "Your file, put together from everything you have done."
  help:
    - fr: "Aucun bouton ne l'écrit à ta place : une partie vide renvoie à l'étape qui la construit."
      en: "No button writes it for you: an empty part points to the step that builds it."
  unlock: {quest: q04, is: completed}
  unlock_hint:
    fr: "Se débloque à la fin de « Tester ta première hypothèse »."
    en: "Unlocks at the end of \"Test your first hypothesis\"."
