# Money: how to find it (CLAUDE.md §49) and examples for the calculators.
# KINDS of money only. No institution, rate, amount or condition is named
# here: such information changes and must be verified, sourced and dated
# before it is shown (Phase 8 content, never invented).
# DRAFT texts (see pack.yaml default_status).
financing_guide:
  - title: {fr: "Avant de chercher de l'argent", en: "Before looking for money"}
    items:
      - fr: "Commence par ce qu'il te faut vraiment : l'équipement indispensable et de quoi tenir les premiers mois. Eripoo le calcule à partir de tes chiffres."
        en: "Start with what you really need: the essential equipment and enough to last the first months. Eripoo works it out from your numbers."
      - fr: "Moins tu empruntes, moins tu risques. Commencer petit, puis grandir avec ce que tu vends, est souvent possible."
        en: "The less you borrow, the less you risk. Starting small and growing with what you sell is often possible."
  - title: {fr: "Les sources possibles", en: "Possible sources"}
    items:
      - fr: "Tes économies (fonds propres) : l'argent le plus simple, sans intérêt ni dette."
        en: "Your savings (own funds): the simplest money, with no interest and no debt."
      - fr: "La famille ou des proches : écris ce qui est convenu (montant, date et façon de rembourser) pour éviter les malentendus."
        en: "Family or friends: write down what you agree (amount, date and how to pay back) to avoid misunderstandings."
      - fr: "La microfinance : de petits prêts, souvent sans garantie lourde. Compare plusieurs offres avant de choisir."
        en: "Microfinance: small loans, often without heavy guarantees. Compare several offers before choosing."
      - fr: "La banque : des montants plus élevés, mais des garanties et des documents demandés."
        en: "A bank: larger amounts, but guarantees and documents are asked for."
      - fr: "Des investisseurs : ils apportent de l'argent contre une part de ton entreprise. Ils voudront voir des preuves que des clients achètent."
        en: "Investors: they bring money in exchange for a share of your business. They will want proof that customers buy."
      - fr: "Concours, subventions, incubateurs : de l'argent ou un accompagnement, souvent sur dossier. Ton dossier Eripoo t'aide à le préparer."
        en: "Competitions, grants, incubators: money or support, often on application. Your Eripoo file helps you prepare it."
  - title: {fr: "Questions à poser avant d'emprunter", en: "Questions to ask before borrowing"}
    items:
      - fr: "Combien vais-je rembourser au total, intérêts et frais compris ?"
        en: "How much will I pay back in total, interest and fees included?"
      - fr: "Combien chaque mois, et à partir de quand ? Mes ventes prévues peuvent-elles le payer ?"
        en: "How much each month, and from when? Can my expected sales pay for it?"
      - fr: "Que se passe-t-il si je rembourse en retard ? Quelle garantie est demandée ?"
        en: "What happens if I pay late? What guarantee is asked for?"
  - title: {fr: "À savoir", en: "Good to know"}
    items:
      - fr: "Eripoo ne cite encore aucun organisme ni aucun taux : ces informations changent et seront ajoutées seulement une fois vérifiées et datées."
        en: "Eripoo does not name any organisation or rate yet: this information changes and will only be added once verified and dated."
