# Quest 7: the business model, written into the Business Model Canvas
# sections (business_model.*); the canvas view assembles them with the
# customers, solution and finance parts already in the project.
id: q07
order: 7
maturity: construction
priority: 4
title:
  fr: "Comment ton projet fonctionne"
  mg: "Ny fomba fiasan'ny tetikasanao"
  en: "How your project works"
summary:
  fr: "Décris comment tu trouves tes clients, ce qu'il te faut pour produire et qui t'aide."
  mg: "Lazao ny fomba ahitanao mpanjifa, izay ilainao hamokarana ary iza no manampy anao."
  en: "Describe how you find customers, what you need to produce and who helps you."
# The Business Model Canvas tool opens with a finished test (tools.yaml).
available_when:
  all:
    - {quest: q06, is: completed}
    - {count: experiments, where: {status: done}, gte: 1}
steps:
  - id: q07.s01
    type: learn
    title:
      fr: "Un modèle économique, c'est quoi ?"
      mg: "Inona ny maodely ara-toekarena?"
      en: "What is a business model?"
    blocks:
      - id: intro
        type: text
        body:
          fr: "Ton offre dit ce que tu vends. Le modèle économique dit comment tout tourne : comment les clients te trouvent, ce que tu fais chaque semaine, et ce dont tu as besoin."
          mg: "Ny tolotrao no milaza izay amidinao. Ny maodely ara-toekarena kosa milaza ny fihodinan'ny zava-drehetra: ny fomba ahitan'ny mpanjifa anao, izay ataonao isan-kerinandro, ary izay ilainao."
          en: "Your offer says what you sell. The business model says how everything runs: how customers find you, what you do every week, and what you need."
      - id: term
        type: term
        plain:
          fr: "Comment mon projet gagne de l'argent, semaine après semaine"
          mg: "Ny fomba ahazoan'ny tetikasako vola, isan-kerinandro"
          en: "How my project earns money, week after week"
        term:
          fr: "Modèle économique"
          mg: "Maodely ara-toekarena"
          en: "Business model"
        definition:
          fr: "L'ensemble des choix qui permettent de créer ton offre, de la vendre et d'être payé."
          mg: "Ireo safidy rehetra ahafahana mamorona ny tolotrao, mivarotra azy ary mahazo vola."
          en: "All the choices that let you make your offer, sell it and get paid."
      - id: example
        type: example
        body:
          fr: "Fara trouve ses clientes au marché, achète l'huile chez un grossiste de Toamasina, fabrique le samedi et livre le lundi. Sa sœur l'aide pour l'emballage."
          mg: "Eny an-tsena no ahitan'i Fara ny mpanjifany, any amin'ny mpivarotra ambongadiny any Toamasina noividianany ny menaka, ny asabotsy no anamboarany ary ny alatsinainy no anaterany. Ny rahavaviny no manampy azy amin'ny fonosana."
          en: "Fara finds her customers at the market, buys oil from a wholesaler in Toamasina, makes soap on Saturday and delivers on Monday. Her sister helps with packaging."
      - id: tip
        type: tip
        body:
          fr: "Tes réponses remplissent ton Business Model Canvas (onglet Outils). Rien n'y est inventé pour toi."
          mg: "Ny valinteninao no mameno ny Business Model Canvas-nao (tabilao Fitaovana). Tsy misy noforonina ho anao ao."
          en: "Your answers fill your Business Model Canvas (Tools tab). Nothing there is invented for you."
  - id: q07.s02
    type: reflect
    title:
      fr: "Tes clients et toi"
      mg: "Ny mpanjifanao sy ianao"
      en: "Your customers and you"
    blocks:
      - id: channels
        type: question
        prompt:
          fr: "Comment tes clients te trouvent-ils, et où achètent-ils ?"
          mg: "Ahoana no ahitan'ny mpanjifa anao, ary aiza no hividianany?"
          en: "How do customers find you, and where do they buy?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Par où un client entend parler de toi, puis où il te paie ?"
              mg: "Amin'ny alalan'inona no handrenesan'ny mpanjifa momba anao, ary aiza no handoavany vola aminao?"
              en: "Where does a customer hear about you, then where do they pay you?"
          example:
            fr: "« Bouche-à-oreille au marché et un groupe Facebook du quartier ; paiement en espèces ou par mobile money à la livraison. »"
            mg: "« Vava miampita eny an-tsena sy vondrona Facebook ao amin'ny fokontany; aloa vola na mobile money rehefa tonga ny entana. »"
            en: "\"Word of mouth at the market and a neighbourhood Facebook group; cash or mobile money on delivery.\""
          hints:
            - fr: "Reprends ce que tes rencontres t'ont appris : où sont tes clients, à qui font-ils confiance ?"
              mg: "Avereno izay nampianarin'ny fihaonanao: aiza ny mpanjifanao, iza no tokisany?"
              en: "Reuse what your conversations taught you: where are your customers, whom do they trust?"
      - id: relationships
        type: question
        prompt:
          fr: "Comment fais-tu pour que tes clients reviennent ?"
          mg: "Ahoana no hataonao mba hiverenan'ny mpanjifanao?"
          en: "How do you make customers come back?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Qu'est-ce qui donnera envie à un client d'acheter une deuxième fois ?"
              mg: "Inona no hahatonga ny mpanjifa te hividy fanindroany?"
              en: "What will make a customer want to buy a second time?"
          example:
            fr: "« Même jour de livraison chaque semaine, et un savon offert après dix lots. »"
            mg: "« Andro iray ihany anaterana isan-kerinandro, ary savony iray maimaim-poana aorian'ny fehezana folo. »"
            en: "\"Same delivery day every week, and a free soap after ten packs.\""
          hints:
            - fr: "Pense à la régularité, au contact, et à ce qui rend service au client."
              mg: "Eritrereto ny fahamarinan-toerana, ny fifandraisana, ary izay manampy ny mpanjifa."
              en: "Think about regularity, contact, and what helps the customer."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici comment tu trouves et gardes tes clients. C'est enregistré dans ton modèle économique."
          mg: "Ity ny fomba ahitanao sy itazonanao ny mpanjifanao. Voatahiry ao amin'ny maodely ara-toekaren'ny tetikasanao izany."
          en: "Here is how you find and keep your customers. It is saved in your business model."
        shows: [channels, relationships]
    outputs:
      - {from: channels, section: business_model, field: channels, tracked: true}
      - {from: relationships, section: business_model, field: relationships, tracked: true}
  - id: q07.s03
    type: reflect
    title:
      fr: "Ce qu'il te faut pour produire"
      mg: "Izay ilainao hamokarana"
      en: "What you need to produce"
    blocks:
      - id: activities
        type: question
        prompt:
          fr: "Que fais-tu chaque semaine pour que ton offre existe ?"
          mg: "Inona no ataonao isan-kerinandro mba hisian'ny tolotrao?"
          en: "What do you do every week so that your offer exists?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Raconte une semaine de travail, du début à la livraison."
              mg: "Tantarao ny herinandro iray fiasana, hatrany am-piandohana ka hatramin'ny fanaterana."
              en: "Describe one week of work, from the start to delivery."
          example:
            fr: "« Acheter l'huile le jeudi, fabriquer le samedi, emballer le dimanche, livrer le lundi. »"
            mg: "« Mividy menaka ny alakamisy, manamboatra ny asabotsy, mamono ny alahady, manatitra ny alatsinainy. »"
            en: "\"Buy oil on Thursday, make soap on Saturday, pack on Sunday, deliver on Monday.\""
          hints:
            - fr: "Liste les tâches qui reviennent, dans l'ordre."
              mg: "Ataovy lisitra ireo asa miverimberina, araka ny filaharany."
              en: "List the tasks that come back, in order."
      - id: resources
        type: question
        prompt:
          fr: "De quoi as-tu besoin pour produire (matériel, lieu, compétences) ?"
          mg: "Inona no ilainao hamokarana (fitaovana, toerana, fahaiza-manao)?"
          en: "What do you need to produce (equipment, place, skills)?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Sans quoi ton projet ne pourrait pas fonctionner ?"
              mg: "Raha tsy misy inona no tsy handehanan'ny tetikasanao?"
              en: "Without what could your project not work?"
          example:
            fr: "« Des moules, une marmite, un coin de cuisine sec, et savoir doser la soude sans danger. »"
            mg: "« Bobongolo, vilany, zoro lakozia maina, ary fahaizana mandanja ny soda tsy misy loza. »"
            en: "\"Moulds, a pot, a dry corner of the kitchen, and knowing how to measure caustic soda safely.\""
          hints:
            - fr: "Pense aux choses, aux lieux, et à ce que tu dois savoir faire."
              mg: "Eritrereto ny zavatra, ny toerana, ary izay tokony ho hainao atao."
              en: "Think about things, places, and what you need to know how to do."
      - id: partners
        type: question
        prompt:
          fr: "Qui t'aide : fournisseurs, proches, partenaires ?"
          mg: "Iza no manampy anao: mpamatsy, havana, mpiara-miasa?"
          en: "Who helps you: suppliers, relatives, partners?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "De qui dépends-tu pour acheter, fabriquer ou livrer ?"
              mg: "Miankina amin'iza ianao amin'ny fividianana, ny fanamboarana na ny fanaterana?"
              en: "Whom do you depend on to buy, make or deliver?"
          example:
            fr: "« Un grossiste d'huile à Toamasina, et ma sœur pour l'emballage. »"
            mg: "« Mpivarotra menaka ambongadiny any Toamasina, ary ny rahavaviko amin'ny fonosana. »"
            en: "\"An oil wholesaler in Toamasina, and my sister for packaging.\""
          hints:
            - fr: "Décris les rôles, sans donner de nom ni de numéro de téléphone."
              mg: "Lazao ny anjara asa, nefa aza manome anarana na laharana finday."
              en: "Describe the roles, without giving names or phone numbers."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ce qui fait tourner ton projet. Ouvre ton Business Model Canvas pour voir l'ensemble."
          mg: "Ity ny mampandeha ny tetikasanao. Sokafy ny Business Model Canvas-nao mba hahitana ny fitambarany."
          en: "Here is what makes your project run. Open your Business Model Canvas to see the whole picture."
        shows: [activities, resources, partners]
    outputs:
      - {from: activities, section: business_model, field: activities, tracked: true}
      - {from: resources, section: business_model, field: resources, tracked: true}
      - {from: partners, section: business_model, field: partners, tracked: true}
