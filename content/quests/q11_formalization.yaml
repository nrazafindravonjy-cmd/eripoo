# Quest 11: prepare the formalities. No rule is stated here: the sourced,
# dated information lives in the administrative preparation tool
# (content/formalization.yaml). The quest only collects what the user
# takes to the counter (formalization.*). Nothing is filed by Eripoo.
id: q11
order: 14
maturity: preparation
priority: 0
title:
  fr: "Préparer tes formalités"
  en: "Prepare your formalities"
summary:
  fr: "Rassemble ce qu'il te faut avant d'aller au guichet."
  en: "Gather what you need before going to the counter."
# The administrative preparation tool opens when q04 is completed.
available_when:
  all:
    - {quest: q04, is: completed}
    - {quest: q06, is: completed}
steps:
  - id: q11.s01
    type: learn
    title:
      fr: "Pourquoi se déclarer ?"
      en: "Why register?"
    blocks:
      - id: intro
        type: text
        body:
          fr: "Selon les cas, une activité déclarée peut plus facilement travailler avec des entreprises, demander un financement et rassurer ses clients. Les démarches dépendent de ta situation et de ta région."
          en: "Depending on the case, a registered activity can more easily work with businesses, ask for funding and reassure customers. The steps depend on your situation and your region."
      - id: tip
        type: tip
        body:
          fr: "L'outil « Préparation administrative » (onglet Outils) présente les informations avec leur source et leur date. Ce qui n'est pas vérifié y est indiqué. Confirme toujours au guichet."
          en: "The \"Administrative preparation\" tool (Tools tab) shows the information with its source and date. What is not checked is marked as such. Always confirm at the counter."
      - id: example
        type: example
        body:
          fr: "Avant d'y aller, Fara écrit le nom envisagé, son activité en une phrase et la liste de ses questions. Au guichet, elle gagne du temps."
          en: "Before going, Fara writes the name she is considering, her activity in one sentence and her list of questions. At the counter, she saves time."
  - id: q11.s02
    type: reflect
    title:
      fr: "Ce que tu apportes au guichet"
      en: "What you bring to the counter"
    blocks:
      - id: business_name
        type: question
        prompt:
          fr: "Quel nom envisages-tu pour ton activité ?"
          en: "What name are you considering for your activity?"
        answer:
          kind: text
          max_length: 120
        help:
          rephrase:
            - fr: "Comment veux-tu que les clients appellent ton activité ?"
              en: "What do you want customers to call your activity?"
          example:
            fr: "« Savon Fara Livraison » (exemple inventé)."
            en: "\"Fara Soap Delivery\" (invented example)."
          hints:
            - fr: "Un nom court, facile à dire et à retenir. Tu pourras le changer avant de déclarer."
              en: "A short name, easy to say and remember. You can change it before registering."
      - id: activity
        type: question
        prompt:
          fr: "Quelle est ton activité principale, en une phrase ?"
          en: "What is your main activity, in one sentence?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Que fais-tu, pour qui, en quelques mots ?"
              en: "What do you do, for whom, in a few words?"
          example:
            fr: "« Fabrication et livraison de savon pour les vendeuses du marché. »"
            en: "\"Making and delivering soap for market sellers.\""
          hints:
            - fr: "Reprends ton offre : ce que tu vends et à qui."
              en: "Reuse your offer: what you sell and to whom."
      - id: questions
        type: question
        prompt:
          fr: "Quelles questions veux-tu poser au guichet ?"
          en: "What questions do you want to ask at the counter?"
        answer:
          kind: text
          max_length: 500
        help:
          rephrase:
            - fr: "Qu'est-ce que tu ne sais pas encore sur les démarches ?"
              en: "What do you not know yet about the steps?"
          example:
            fr: "« Quelle forme me convient ? Quels papiers apporter ? Combien cela coûte et combien de temps cela prend ? »"
            en: "\"Which form suits me? Which papers should I bring? How much does it cost and how long does it take?\""
          hints:
            - fr: "Regarde dans l'outil « Préparation administrative » ce qui est marqué non vérifié : ce sont de bonnes questions."
              en: "Look in the \"Administrative preparation\" tool for what is marked unchecked: those are good questions."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ce que tu apportes au guichet. Retrouve-le dans l'outil « Préparation administrative »."
          en: "Here is what you bring to the counter. Find it in the \"Administrative preparation\" tool."
        shows: [business_name, activity, questions]
    outputs:
      - {from: business_name, section: formalization, field: business_name, tracked: true}
      - {from: activity, section: formalization, field: activity, tracked: true}
      - {from: questions, section: formalization, field: questions, tracked: true}
