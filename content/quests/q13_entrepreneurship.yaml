# Quest 13 (shown first): for people without an idea yet. What starting
# a small business means, and what the user already has to start with.
id: q13
order: 1
maturity: exploration
priority: 42
title:
  fr: "Comprendre l'entrepreneuriat"
  en: "Understand entrepreneurship"
summary:
  fr: "Entreprendre, c'est d'abord résoudre un problème pour des gens. Tu as déjà des atouts pour commencer."
  en: "Starting a business is first about solving a problem for people. You already have assets to start."
available_when: {fact: diag.entry_profile, eq: no_idea}
hide_when_locked: true
steps:
  - id: q13.s01
    type: learn
    title:
      fr: "Entreprendre, c'est quoi ?"
      en: "What is starting a business?"
    blocks:
      - id: intro
        type: text
        body:
          fr: "Entreprendre, ce n'est pas avoir beaucoup d'argent ou une idée géniale. C'est trouver un problème que des gens vivent, leur proposer une réponse, et vérifier pas à pas qu'ils sont prêts à payer."
          en: "Starting a business is not about having a lot of money or a brilliant idea. It is finding a problem people live with, offering them an answer, and checking step by step that they are ready to pay."
      - id: term
        type: term
        plain:
          fr: "Quelqu'un qui crée une activité pour répondre à un besoin"
          en: "Someone who creates an activity to meet a need"
        term:
          fr: "Entrepreneur"
          en: "Entrepreneur"
        definition:
          fr: "Une personne qui prend l'initiative d'une activité, en assume les risques et apprend en testant."
          en: "A person who takes the initiative of an activity, bears its risks and learns by testing."
      - id: example
        type: example
        body:
          fr: "Hery, à Fianarantsoa, n'avait pas d'idée. En écoutant ses voisins se plaindre de leurs téléphones en panne, il a commencé par réparer chez lui, le soir. (Exemple inventé.)"
          en: "Hery, in Fianarantsoa, had no idea. Hearing his neighbours complain about broken phones, he started repairing at home, in the evening. (Invented example.)"
      - id: tip
        type: tip
        body:
          fr: "Commencer petit est une force : tu apprends vite, tu risques peu, et tu peux changer de direction."
          en: "Starting small is a strength: you learn fast, risk little, and can change direction."
  - id: q13.s02
    type: reflect
    title:
      fr: "Ce que tu as déjà"
      en: "What you already have"
    blocks:
      - id: skills
        type: question
        prompt:
          fr: "Que sais-tu bien faire, ou qu'est-ce qu'on te demande souvent ?"
          en: "What are you good at, or what do people often ask you for?"
        answer:
          kind: text
          max_length: 280
        help:
          rephrase:
            - fr: "Pour quoi tes proches viennent-ils te voir ?"
              en: "What do people close to you come to you for?"
            - fr: "Qu'est-ce que tu fais avec plaisir, même sans être payé ?"
              en: "What do you enjoy doing, even unpaid?"
          example:
            fr: "« Je cuisine bien, et on me demande souvent de préparer les repas de fête. »"
            en: "\"I cook well, and people often ask me to prepare party meals.\""
          hints:
            - fr: "Pense à l'école, au travail, à la maison, à l'église ou au quartier."
              en: "Think of school, work, home, church or the neighbourhood."
      - id: means
        type: question
        prompt:
          fr: "De quoi disposes-tu déjà pour commencer (matériel, lieu, contacts) ?"
          en: "What do you already have to start (equipment, place, contacts)?"
        answer:
          kind: text
          max_length: 280
        help:
          rephrase:
            - fr: "Qu'est-ce que tu pourrais utiliser dès demain, sans rien acheter ?"
              en: "What could you use tomorrow, without buying anything?"
          example:
            fr: "« Une grande marmite, un coin devant la maison, et beaucoup de voisins. »"
            en: "\"A big pot, a spot in front of the house, and many neighbours.\""
          hints:
            - fr: "Les personnes que tu connais comptent aussi : clients, conseils, aide."
              en: "The people you know count too: customers, advice, help."
      - id: network
        type: question
        prompt:
          fr: "Qui connais-tu qui pourrait t'aider ?"
          en: "Who do you know who could help you?"
        answer:
          kind: text
          max_length: 280
        help:
          rephrase:
            - fr: "Quelles personnes pourraient te conseiller, te prêter du matériel ou devenir tes premiers clients ?"
              en: "Which people could advise you, lend you equipment or become your first customers?"
          example:
            fr: "« Ma tante qui vend au marché, et le groupe de jeunes de l'église. »"
            en: "\"My aunt who sells at the market, and the church youth group.\""
          hints:
            - fr: "Ne note pas de nom : un rôle suffit (« ma voisine commerçante »)."
              en: "Don't write names: a role is enough (\"my shopkeeper neighbour\")."
      - id: affordable
        type: question
        prompt:
          fr: "Combien peux-tu risquer sans te mettre en difficulté ?"
          en: "How much can you risk without getting into trouble?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Quelle somme ou quel temps pourrais-tu perdre sans que ce soit grave ?"
              en: "What amount or time could you lose without it being serious?"
          example:
            fr: "« 20 000 ariary et mes samedis matin. »"
            en: "\"20,000 ariary and my Saturday mornings.\""
          hints:
            - fr: "Commence avec ce que tu peux te permettre de perdre : c'est ce qui permet d'essayer sans peur."
              en: "Start with what you can afford to lose: it lets you try without fear."
      - id: framework
        type: tip
        body:
          fr: "Partir de ce que tu es, de ce que tu sais, de qui tu connais, et ne risquer que ce que tu peux perdre : c'est l'effectuation, une méthode tirée de l'étude d'entrepreneurs expérimentés. Les partenaires et les financeurs connaissent ce mot."
          en: "Starting from who you are, what you know and who you know, and risking only what you can lose: that is effectuation, a method drawn from studying experienced entrepreneurs. Partners and funders know this term."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici tes atouts. Garde-les en tête : ils t'aideront à repérer une bonne opportunité."
          en: "Here are your assets. Keep them in mind: they will help you spot a good opportunity."
        shows: [skills, means, network, affordable]
