# Quest 9: test the offer by selling before launching (pre-sale or price
# test). Completion counts records by category and status, never text.
id: q09
order: 12
maturity: construction
priority: 2
title:
  fr: "Tester ton offre"
  en: "Test your offer"
summary:
  fr: "Vérifie que des clients paient vraiment ton offre, à ton prix."
  en: "Check that customers really pay for your offer, at your price."
available_when: {quest: q06, is: completed}
steps:
  - id: q09.s01
    type: learn
    title:
      fr: "Dire oui n'est pas acheter"
      en: "Saying yes is not buying"
    blocks:
      - id: intro
        type: text
        body:
          fr: "Beaucoup de gens disent « j'achèterais » pour être polis. La seule vraie preuve, c'est un client qui paie ou qui réserve en donnant une avance."
          en: "Many people say \"I would buy\" to be polite. The only real proof is a customer who pays or books by giving a deposit."
      - id: term
        type: term
        plain:
          fr: "Vendre avant d'avoir tout fabriqué"
          en: "Selling before making everything"
        term:
          fr: "Prévente"
          en: "Pre-sale"
        definition:
          fr: "Prendre des commandes payées (ou avec une avance) avant de produire, pour vérifier la demande sans risquer ton stock."
          en: "Taking paid orders (or with a deposit) before producing, to check demand without risking your stock."
      - id: example
        type: example
        body:
          fr: "Fara propose à 10 vendeuses de réserver un lot avec une petite avance. Elle a décidé avant : réussi si au moins 4 réservent. (Exemple inventé.)"
          en: "Fara offers 10 sellers to book a pack with a small deposit. She decided beforehand: it succeeds if at least 4 book. (Invented example.)"
      - id: tip
        type: tip
        body:
          fr: "Si personne ne paie, ce n'est pas un échec : change le prix, l'offre ou les clients visés, et teste encore."
          en: "If nobody pays, it is not a failure: change the price, the offer or the target customers, and test again."
  - id: q09.s02
    type: act
    title:
      fr: "Écris ton hypothèse sur le prix"
      en: "Write your price hypothesis"
    blocks:
      - id: how
        type: text
        body:
          fr: "Ouvre l'onglet Projet, puis « Hypothèses ». Ajoute une hypothèse de catégorie « Le prix », par exemple : « Je pense que 4 vendeuses sur 10 réserveront à ce prix. » Reviens ensuite ici."
          en: "Open the Project tab, then \"Hypotheses\". Add a hypothesis in the \"The price\" category, for example: \"I think 4 sellers out of 10 will book at this price.\" Then come back here."
    complete_when: {count: hypotheses, where: {category: price}, gte: 1}
  - id: q09.s03
    type: act
    title:
      fr: "Lance une prévente"
      en: "Start a pre-sale"
    blocks:
      - id: how
        type: text
        body:
          fr: "Dans cette hypothèse, prépare un test avec la méthode « Prévendre » ou « Tester un prix », puis commence-le."
          en: "In this hypothesis, plan a test with the \"Pre-sell\" or \"Test a price\" method, then start it."
      - id: go
        type: mission
        mission: m.pre_sell
    complete_when:
      any:
        - {count: experiments, where: {method: pre_sale, status: running}, gte: 1}
        - {count: experiments, where: {method: pre_sale, status: done}, gte: 1}
        - {count: experiments, where: {method: price_test, status: running}, gte: 1}
        - {count: experiments, where: {method: price_test, status: done}, gte: 1}
  - id: q09.s04
    type: checkpoint
    title:
      fr: "Conclure sur ton prix"
      en: "Conclude on your price"
    blocks:
      - id: how
        type: text
        body:
          fr: "Ajoute tes preuves (une vente, un chiffre, une note), puis conclus ton hypothèse sur le prix. Infirmée ou non, tu sais maintenant quelque chose de vrai."
          en: "Add your evidence (a sale, a number, a note), then conclude your price hypothesis. Disproved or not, you now know something true."
    complete_when:
      any:
        - {count: hypotheses, where: {category: price, status: validated}, gte: 1}
        - {count: hypotheses, where: {category: price, status: invalidated}, gte: 1}
        - {count: hypotheses, where: {category: price, status: inconclusive}, gte: 1}
