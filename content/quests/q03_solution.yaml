# Quest 3: a first idea of solution, built on what customers said.
id: q03
order: 6
maturity: validation
priority: 10
title:
  fr: "Imaginer ta solution"
  en: "Imagine your solution"
summary:
  fr: "À partir de ce que tu as appris, imagine une première réponse simple."
  en: "Based on what you learned, imagine a first simple answer."
applies_when: {not: {fact: diag.entry_profile, in: [existing_activity, existing_customers]}}
available_when: {quest: q02, is: completed}
steps:
  - id: q03.s01
    type: learn
    title:
      fr: "Commencer petit"
      en: "Start small"
    blocks:
      - id: intro
        type: text
        body:
          fr: "Ta première solution n'a pas besoin d'être parfaite. Elle doit être assez simple pour être essayée vite, avec peu d'argent."
          en: "Your first solution doesn't need to be perfect. It must be simple enough to try quickly, with little money."
      - id: term
        type: term
        plain:
          fr: "Une première version, simple, pour essayer"
          en: "A simple first version, to try things out"
        term:
          fr: "Produit minimum viable"
          en: "Minimum viable product"
        definition:
          fr: "La plus petite version de ta solution qui permet de vérifier si des clients en veulent vraiment."
          en: "The smallest version of your solution that lets you check whether customers really want it."
      - id: example
        type: example
        body:
          fr: "Avant d'ouvrir une boutique, Fara livre du savon à pied à dix mères, une fois par semaine, pour voir si elles commandent à nouveau."
          en: "Before opening a shop, Fara delivers soap on foot to ten mothers once a week, to see if they order again."
  - id: q03.s02
    type: reflect
    title:
      fr: "Ta première idée de solution"
      en: "Your first solution idea"
    blocks:
      - id: solution
        type: question
        prompt:
          fr: "Comment pourrais-tu aider tes clients, simplement ?"
          en: "How could you help your customers, simply?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Que pourrais-tu proposer dès la semaine prochaine ?"
              en: "What could you offer as soon as next week?"
            - fr: "Décris ce que le client reçoit, et comment."
              en: "Describe what the customer gets, and how."
          example:
            fr: "« Livrer savon et produits de base au marché, chaque lundi, sur commande. »"
            en: "\"Deliver soap and basics to the market every Monday, to order.\""
          hints:
            - fr: "Repars de ce qui t'a surpris pendant tes rencontres."
              en: "Start again from what surprised you in your conversations."
      - id: different
        type: question
        prompt:
          fr: "En quoi est-ce mieux que ce qu'ils font aujourd'hui ?"
          en: "How is it better than what they do today?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Pourquoi choisiraient-ils ta solution plutôt que leur habitude ?"
              en: "Why would they choose your solution over their habit?"
          example:
            fr: "« Elles gagnent une heure et paient le même prix. »"
            en: "\"They save an hour and pay the same price.\""
          hints:
            - fr: "Pense au temps, à l'argent, à la fatigue ou à la confiance."
              en: "Think about time, money, tiredness or trust."
      - id: kind
        type: question
        prompt:
          fr: "Ta solution, c'est plutôt…"
          en: "Your solution is mostly…"
        answer:
          kind: choice
          options:
            - value: product
              label: {fr: "Un produit", en: "A product"}
            - value: service
              label: {fr: "Un service", en: "A service"}
            - value: both
              label: {fr: "Les deux", en: "Both"}
        help:
          rephrase:
            - fr: "Vends-tu un objet, ou fais-tu quelque chose pour le client ?"
              en: "Do you sell an object, or do something for the customer?"
          example:
            fr: "Du savon livré : c'est les deux, un produit et un service de livraison."
            en: "Delivered soap is both: a product and a delivery service."
          hints:
            - fr: "Si tu hésites, choisis « Les deux »."
              en: "If unsure, choose \"Both\"."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ta première idée de solution. Elle évoluera avec ce que tes clients te diront."
          en: "Here is your first solution idea. It will change with what your customers tell you."
        shows: [solution, different, kind]
    outputs:
      - {from: solution, section: solution, field: first_idea, tracked: true}
      - {from: different, section: solution, field: advantage, tracked: true}
      - {from: kind, fact: solution.kind}
  - id: q03.s03
    type: reflect
    title:
      fr: "Ce que ton client y gagne"
      en: "What your customer gains"
    blocks:
      - id: gains
        type: question
        prompt:
          fr: "Qu'est-ce que ton client y gagne ?"
          en: "What does your customer gain?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Qu'est-ce qui sera plus facile, plus beau ou plus agréable pour lui ?"
              en: "What will be easier, more beautiful or more pleasant for them?"
          example:
            fr: "« Du temps pour vendre, et la tranquillité d'avoir toujours du savon. »"
            en: "\"Time to sell, and the peace of mind of always having soap.\""
          hints:
            - fr: "Pense au temps, à l'argent, au plaisir et à la fierté."
              en: "Think of time, money, pleasure and pride."
      - id: relieves
        type: question
        prompt:
          fr: "Quelle gêne ou quel manque ta solution enlève-t-elle ?"
          en: "What trouble or lack does your solution remove?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Reprends ce qui les gêne le plus : ta solution y répond-elle ?"
              en: "Take what bothers them most: does your solution answer it?"
          example:
            fr: "« Plus besoin de marcher une heure ni de demander aux voisines. »"
            en: "\"No more walking an hour or asking the neighbours.\""
          hints:
            - fr: "Si ta solution n'enlève rien d'important, modifie-la avant de la tester."
              en: "If your solution removes nothing important, change it before testing it."
      - id: framework
        type: tip
        body:
          fr: "Ce que tu viens de faire, relier ton offre à ce que tes clients gagnent et à ce qui les gêne, s'appelle une proposition de valeur. Les partenaires et les financeurs connaissent ce mot."
          en: "What you just did, linking your offer to what customers gain and what bothers them, is called a value proposition. Partners and funders know this term."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ce que ta solution apporte. C'est enregistré dans ton projet."
          en: "Here is what your solution brings. It is saved in your project."
        shows: [gains, relieves]
    outputs:
      - {from: gains, section: solution, field: gains, tracked: true}
      - {from: relieves, section: solution, field: relieves, tracked: true}
