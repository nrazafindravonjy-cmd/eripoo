# Quest 2: understand future customers by talking to them.
id: q02
order: 5
maturity: validation
priority: 20
title:
  fr: "Comprendre tes futurs clients"
  en: "Understand your future customers"
summary:
  fr: "Découvre qui vit le problème et ce qu'ils font aujourd'hui pour s'en sortir."
  en: "Find out who has the problem and what they do about it today."
available_when:
  any:
    - {step: q01.s02, is: [completed, fast_tracked]}
    - {step: q01.s06, is: [completed, fast_tracked]}
steps:
  - id: q02.s01
    type: learn
    title:
      fr: "Qui sont tes clients ?"
      en: "Who are your customers?"
    blocks:
      - id: intro
        type: text
        body:
          fr: "Tes clients ne sont pas « tout le monde ». Ce sont des personnes précises, qui vivent le problème et qui pourraient payer pour le résoudre."
          en: "Your customers are not \"everyone\". They are specific people who have the problem and could pay to solve it."
      - id: term
        type: term
        plain:
          fr: "Le groupe de personnes pour qui tu travailles"
          en: "The group of people you work for"
        term:
          fr: "Client cible"
          en: "Target customer"
        definition:
          fr: "Les personnes que ton projet veut servir en premier, décrites par ce qu'elles vivent, où elles sont et ce qu'elles peuvent payer."
          en: "The people your project wants to serve first, described by what they live, where they are and what they can pay."
      - id: example
        type: example
        body:
          fr: "Pour Fara, ce n'est pas « les habitants de Toamasina » mais « les mères qui travaillent au marché de Bazary Be ». C'est plus précis, donc plus facile à rencontrer."
          en: "For Fara, it's not \"people in Toamasina\" but \"mothers who work at Bazary Be market\". That is more precise, so easier to meet."
  - id: q02.s02
    type: reflect
    title:
      fr: "Décrire ton client"
      en: "Describe your customer"
    blocks:
      - id: description
        type: question
        prompt:
          fr: "Décris la personne qui a le plus besoin de ta solution."
          en: "Describe the person who most needs your solution."
        answer:
          kind: text
          max_length: 280
        help:
          rephrase:
            - fr: "Si tu ne pouvais aider qu'un seul type de personne, ce serait qui ?"
              en: "If you could help only one kind of person, who would it be?"
            - fr: "Dis son âge à peu près, son travail et sa journée."
              en: "Give their rough age, their work and their day."
          example:
            fr: "« Une mère de 25 à 40 ans, vendeuse au marché, qui rentre tard et n'a pas le temps de faire les courses. »"
            en: "\"A mother aged 25 to 40, a market seller, who gets home late and has no time to shop.\""
          hints:
            - fr: "Reprends la personne que tu as décrite dans la quête précédente et ajoute un détail."
              en: "Take the person you described in the last quest and add one detail."
      - id: where
        type: question
        prompt:
          fr: "Où peux-tu rencontrer ces personnes ?"
          en: "Where can you meet these people?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Dans quels lieux passent-elles souvent ?"
              en: "Which places do they often go to?"
          example:
            fr: "« Au marché le matin, à la sortie de l'école, à l'église le dimanche. »"
            en: "\"At the market in the morning, outside the school, at church on Sunday.\""
          hints:
            - fr: "Pense aux lieux et aux heures où tu pourrais leur parler quelques minutes."
              en: "Think of places and times when you could talk to them for a few minutes."
      - id: today
        type: question
        prompt:
          fr: "Aujourd'hui, que font-elles face à ce problème ?"
          en: "Today, what do they do about this problem?"
        answer:
          kind: choice
          options:
            - value: pays_other
              label: {fr: "Elles paient déjà une autre solution", en: "They already pay for another solution"}
            - value: own_way
              label: {fr: "Elles se débrouillent seules", en: "They manage on their own"}
            - value: nothing
              label: {fr: "Elles ne font rien", en: "They do nothing"}
        help:
          rephrase:
            - fr: "Comment ces personnes s'en sortent-elles sans toi ?"
              en: "How do these people cope without you?"
          example:
            fr: "Les mères de Fara envoient parfois un enfant au magasin : elles se débrouillent seules."
            en: "The mothers Fara knows sometimes send a child to the shop: they manage on their own."
          hints:
            - fr: "Si elles paient déjà autre chose, c'est bon signe : le problème compte pour elles."
              en: "If they already pay for something else, that's a good sign: the problem matters to them."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ton client tel que tu l'imagines aujourd'hui. La prochaine étape : vérifier en lui parlant."
          en: "Here is your customer as you picture them today. Next: check by talking to them."
        shows: [description, where, today]
    outputs:
      - {from: description, section: customers, field: description, tracked: true}
      - {from: where, section: customers, field: where_to_meet}
      - {from: today, fact: customers.current_solution}
  - id: q02.s03
    type: act
    title:
      fr: "Parler à trois personnes"
      en: "Talk to three people"
    blocks:
      - id: why
        type: text
        body:
          fr: "Tu ne présentes pas ton idée : tu écoutes. Le but est de comprendre leur vie, pas de les convaincre."
          en: "You don't pitch your idea: you listen. The goal is to understand their life, not to convince them."
      - id: go
        type: mission
        mission: m.talk_three
    complete_when: {mission: m.talk_three, is: completed}
  - id: q02.s04
    type: reflect
    title:
      fr: "Ce que tu as appris"
      en: "What you learned"
    blocks:
      - id: learned
        type: question
        prompt:
          fr: "Qu'est-ce qui t'a surpris dans ce qu'elles t'ont dit ?"
          en: "What surprised you in what they told you?"
        answer:
          kind: text
          max_length: 400
        help:
          rephrase:
            - fr: "Qu'as-tu découvert que tu ne savais pas avant ?"
              en: "What did you discover that you didn't know before?"
          example:
            fr: "« Le savon n'est pas le vrai souci : c'est l'eau, qui manque le matin. »"
            en: "\"Soap isn't the real issue: it's water, which runs short in the morning.\""
          hints:
            - fr: "Relis ce que tu as écrit dans la mission."
              en: "Read again what you wrote in the mission."
      - id: confirmed
        type: question
        prompt:
          fr: "Tes rencontres confirment-elles ton idée de départ ?"
          en: "Do your conversations confirm your starting idea?"
        answer:
          kind: choice
          options:
            - value: "yes"
              label: {fr: "Oui, clairement", en: "Yes, clearly"}
            - value: partly
              label: {fr: "En partie", en: "Partly"}
            - value: "no"
              label: {fr: "Non, pas vraiment", en: "No, not really"}
        help:
          rephrase:
            - fr: "Les personnes rencontrées vivent-elles vraiment ce problème, ou ont-elles vraiment cette envie ?"
              en: "Do the people you met really have this problem, or really have this desire?"
          example:
            fr: "Deux personnes sur trois en parlent sans que tu poses la question : c'est « Oui »."
            en: "Two people out of three bring it up without you asking: that's a \"Yes\"."
          hints:
            - fr: "« Non » n'est pas un échec : tu viens d'éviter de construire quelque chose d'inutile."
              en: "\"No\" is not a failure: you just avoided building something useless."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ce que tu retiens de tes rencontres."
          en: "Here is what you take away from your conversations."
        shows: [learned, confirmed]
    outputs:
      - {from: learned, section: customers, field: interview_learnings, tracked: true}
      - {from: confirmed, fact: customers.problem_confirmed}
  - id: q02.s05
    type: reflect
    title:
      fr: "À la place de tes clients"
      en: "In your customers' shoes"
    blocks:
      - id: says
        type: question
        prompt:
          fr: "Que disent-ils quand ils en parlent ?"
          en: "What do they say when they talk about it?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Quelle phrase as-tu entendue plusieurs fois pendant tes rencontres ?"
              en: "Which sentence did you hear several times during your conversations?"
          example:
            fr: "« Le savon, on y pense toujours trop tard. »"
            en: "\"Soap, we always think of it too late.\""
          hints:
            - fr: "Reprends leurs mots, pas les tiens."
              en: "Use their words, not yours."
      - id: does
        type: question
        prompt:
          fr: "Que font-ils aujourd'hui ?"
          en: "What do they do today?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Comment s'organisent-ils, concrètement ?"
              en: "How do they manage, concretely?"
          example:
            fr: "« Elles empruntent du savon aux voisines et achètent un gros lot une fois par mois. »"
            en: "\"They borrow soap from neighbours and buy a big batch once a month.\""
          hints:
            - fr: "Décris ce que tu as vu ou entendu, pas ce que tu supposes."
              en: "Describe what you saw or heard, not what you suppose."
      - id: feels
        type: question
        prompt:
          fr: "Que ressentent-ils ?"
          en: "How do they feel?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Sont-ils agacés, fatigués, fiers, pressés, inquiets ?"
              en: "Are they annoyed, tired, proud, rushed, worried?"
          example:
            fr: "« De la gêne de toujours demander aux voisines. »"
            en: "\"Embarrassed to always ask the neighbours.\""
          hints:
            - fr: "Un sentiment fort, c'est souvent une bonne raison d'acheter."
              en: "A strong feeling is often a good reason to buy."
      - id: lacks
        type: question
        prompt:
          fr: "Qu'est-ce qui les gêne ou leur manque le plus ?"
          en: "What bothers them or is missing the most?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "S'ils pouvaient changer une seule chose, laquelle serait-ce ?"
              en: "If they could change one thing only, what would it be?"
          example:
            fr: "« Avoir du savon sous la main sans faire le trajet. »"
            en: "\"Having soap at hand without the trip.\""
          hints:
            - fr: "C'est souvent là que se cache ta future offre."
              en: "That is often where your future offer hides."
      - id: framework
        type: tip
        body:
          fr: "Ce que tu viens de faire, te mettre à la place de tes clients, s'appelle une carte d'empathie. Les partenaires et les financeurs connaissent ce mot."
          en: "What you just did, putting yourself in your customers' shoes, is called an empathy map. Partners and funders know this term."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici tes clients vus de l'intérieur. C'est enregistré dans ton projet."
          en: "Here are your customers seen from the inside. It is saved in your project."
        shows: [says, does, feels, lacks]
    outputs:
      - {from: says, section: customers, field: says, tracked: true}
      - {from: does, section: customers, field: does, tracked: true}
      - {from: feels, section: customers, field: feels, tracked: true}
      - {from: lacks, section: customers, field: lacks, tracked: true}
