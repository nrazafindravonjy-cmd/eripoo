# Quest 10: prepare the launch: how people will hear about the project
# (marketing.*) and the first steps in order (launch.*).
id: q10
order: 13
maturity: preparation
priority: 1
title:
  fr: "Préparer ton lancement"
  en: "Prepare your launch"
summary:
  fr: "Décide comment les clients entendront parler de toi et ce que tu feras en premier."
  en: "Decide how customers will hear about you and what you will do first."
available_when:
  all:
    - {quest: q07, is: completed}
    - {quest: q09, is: completed}
steps:
  - id: q10.s01
    type: learn
    title:
      fr: "Un lancement se prépare"
      en: "A launch is prepared"
    blocks:
      - id: intro
        type: text
        body:
          fr: "Lancer, ce n'est pas attendre que les clients arrivent. C'est aller vers eux avec un message simple, aux bons endroits, et savoir quoi faire chaque jour de la première semaine."
          en: "Launching is not waiting for customers to come. It is going to them with a simple message, in the right places, and knowing what to do each day of the first week."
      - id: example
        type: example
        body:
          fr: "Fara dit : « Du savon livré au marché le lundi, moins cher que la boutique. » Elle le dit aux vendeuses du marché et le poste dans le groupe du quartier."
          en: "Fara says: \"Soap delivered to the market on Mondays, cheaper than the shop.\" She tells market sellers and posts it in the neighbourhood group."
      - id: tip
        type: tip
        body:
          fr: "Commence par les personnes qui ont déjà réservé ou montré de l'intérêt : ce sont tes premiers ambassadeurs."
          en: "Start with the people who already booked or showed interest: they are your first ambassadors."
  - id: q10.s02
    type: reflect
    title:
      fr: "Ton message"
      en: "Your message"
    blocks:
      - id: target
        type: question
        prompt:
          fr: "À qui parles-tu en premier ?"
          en: "Who do you talk to first?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Quel groupe de clients vas-tu toucher dès le premier jour ?"
              en: "Which group of customers will you reach on day one?"
          example:
            fr: "« Les vendeuses du marché qui ont déjà réservé, puis leurs voisines d'étal. »"
            en: "\"The market sellers who already booked, then their stall neighbours.\""
          hints:
            - fr: "Décris un groupe précis, sans nom ni numéro de téléphone."
              en: "Describe a precise group, without names or phone numbers."
      - id: message
        type: question
        prompt:
          fr: "Que leur dis-tu, en une phrase ?"
          en: "What do you tell them, in one sentence?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Quelle phrase donne envie d'essayer ton offre ?"
              en: "Which sentence makes people want to try your offer?"
          example:
            fr: "« Du savon livré au marché chaque lundi, moins cher que la boutique. »"
            en: "\"Soap delivered to the market every Monday, cheaper than the shop.\""
          hints:
            - fr: "Dis ce que le client gagne (temps, argent, confort), pas comment tu le fais."
              en: "Say what the customer gains (time, money, comfort), not how you do it."
      - id: channels
        type: question
        prompt:
          fr: "Où entendront-ils parler de toi ?"
          en: "Where will they hear about you?"
        answer:
          kind: text
          max_length: 300
        help:
          rephrase:
            - fr: "Par quels lieux ou moyens ton message arrivera-t-il jusqu'à eux ?"
              en: "Through which places or means will your message reach them?"
          example:
            fr: "« De vive voix au marché, le groupe Facebook du quartier, une affiche à l'épicerie. »"
            en: "\"Face to face at the market, the neighbourhood Facebook group, a poster at the grocery.\""
          hints:
            - fr: "Choisis deux ou trois endroits où tes clients sont déjà, plutôt que partout."
              en: "Pick two or three places where your customers already are, rather than everywhere."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ton message de lancement. Il est enregistré dans ton plan marketing."
          en: "Here is your launch message. It is saved in your marketing plan."
        shows: [target, message, channels]
    outputs:
      - {from: target, section: marketing, field: target, tracked: true}
      - {from: message, section: marketing, field: message, tracked: true}
      - {from: channels, section: marketing, field: channels, tracked: true}
  - id: q10.s03
    type: reflect
    title:
      fr: "Tes premières étapes"
      en: "Your first steps"
    blocks:
      - id: first_steps
        type: question
        prompt:
          fr: "Quelles sont tes premières étapes, dans l'ordre ?"
          en: "What are your first steps, in order?"
        answer:
          kind: text
          max_length: 500
        help:
          rephrase:
            - fr: "Que feras-tu le premier jour, puis le deuxième, puis à la fin de la semaine ?"
              en: "What will you do on day one, then day two, then at the end of the week?"
          example:
            fr: "« 1. Acheter l'huile pour 20 lots. 2. Fabriquer samedi. 3. Livrer les réservations lundi. 4. Proposer aux voisines d'étal. »"
            en: "\"1. Buy oil for 20 packs. 2. Make soap on Saturday. 3. Deliver bookings on Monday. 4. Offer to stall neighbours.\""
          hints:
            - fr: "Trois à cinq étapes suffisent. Commence par ce qui ne coûte presque rien."
              en: "Three to five steps are enough. Start with what costs almost nothing."
      - id: when
        type: question
        prompt:
          fr: "Quand veux-tu commencer ?"
          en: "When do you want to start?"
        answer:
          kind: text
          max_length: 100
        help:
          rephrase:
            - fr: "Choisis un jour ou une semaine pour ta première vente."
              en: "Pick a day or a week for your first sale."
          example:
            fr: "« Le premier lundi du mois prochain. »"
            en: "\"The first Monday of next month.\""
          hints:
            - fr: "Une date proche et réaliste vaut mieux qu'une date parfaite et lointaine."
              en: "A near, realistic date beats a perfect, distant one."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ton plan de lancement. Il est enregistré dans ton projet."
          en: "Here is your launch plan. It is saved in your project."
        shows: [first_steps, when]
    outputs:
      - {from: first_steps, section: launch, field: first_steps, tracked: true}
      - {from: when, section: launch, field: when, tracked: true}
  - id: q10.s04
    type: reflect
    title:
      fr: "Ton objectif du premier mois"
      en: "Your first month's goal"
    blocks:
      - id: goal
        type: question
        prompt:
          fr: "Que veux-tu avoir réussi à la fin du premier mois ?"
          en: "What do you want to have achieved by the end of the first month?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Quel résultat te rendrait fier dans un mois ?"
              en: "What result would make you proud in a month?"
          example:
            fr: "« Avoir des clientes régulières au marché du lundi. »"
            en: "\"Having regular customers at the Monday market.\""
          hints:
            - fr: "Un seul objectif, précis, vaut mieux que plusieurs flous."
              en: "One precise goal beats several vague ones."
      - id: goal_measure
        type: question
        prompt:
          fr: "Combien ? Comment sauras-tu que c'est atteint ?"
          en: "How many? How will you know it is reached?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Quel chiffre vas-tu compter pour vérifier ?"
              en: "What number will you count to check?"
          example:
            fr: "« 15 clientes qui commandent au moins deux lundis de suite. »"
            en: "\"15 customers who order at least two Mondays in a row.\""
          hints:
            - fr: "Choisis un chiffre que tu peux atteindre avec tes moyens d'aujourd'hui."
              en: "Choose a number you can reach with what you have today."
      - id: goal_who
        type: question
        prompt:
          fr: "Qui s'en occupe ?"
          en: "Who takes care of it?"
        answer:
          kind: text
          max_length: 200
        help:
          rephrase:
            - fr: "Est-ce toi, ou quelqu'un qui t'aide ?"
              en: "Is it you, or someone who helps you?"
          example:
            fr: "« Moi pour les ventes, ma sœur pour les livraisons. »"
            en: "\"Me for sales, my sister for deliveries.\""
          hints:
            - fr: "Un objectif sans responsable n'avance pas."
              en: "A goal without someone in charge doesn't move."
      - id: framework
        type: tip
        body:
          fr: "Un objectif précis, chiffré, confié à quelqu'un, réaliste et daté s'appelle un objectif SMART. Les partenaires et les financeurs connaissent ce mot."
          en: "A goal that is precise, measured, assigned, realistic and dated is called a SMART goal. Partners and funders know this term."
      - id: recap
        type: synthesis
        intro:
          fr: "Voici ton objectif. Il est enregistré dans ton plan de lancement."
          en: "Here is your goal. It is saved in your launch plan."
        shows: [goal, goal_measure, goal_who]
    outputs:
      - {from: goal, section: launch, field: goal, tracked: true}
      - {from: goal_measure, section: launch, field: goal_measure, tracked: true}
      - {from: goal_who, section: launch, field: goal_who, tracked: true}
