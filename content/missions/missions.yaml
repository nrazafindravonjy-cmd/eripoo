# Missions: short real-world actions proposed by steps. They never ask
# for names, phone numbers or recordings of other people.
- id: m.observe_problem
  title:
    fr: "Observer le problème en vrai"
    en: "Observe the problem for real"
  objective:
    fr: "Voir de tes propres yeux comment les gens vivent le problème."
    en: "See with your own eyes how people live with the problem."
  instructions:
    - fr: "Va là où le problème arrive (marché, arrêt de taxi-be, quartier…)."
      en: "Go where the problem happens (market, minibus stop, neighbourhood…)."
    - fr: "Observe pendant 20 minutes, sans rien vendre."
      en: "Watch for 20 minutes without selling anything."
    - fr: "Note ce que les gens font, ce qui leur prend du temps, ce qui les agace. Pas de nom, pas de numéro de téléphone."
      en: "Note what people do, what takes them time, what annoys them. No names, no phone numbers."
  deliverable:
    fr: "Ce que tu as vu, en deux ou trois phrases."
    en: "What you saw, in two or three sentences."
  duration_minutes: 30
  difficulty: 1
  example:
    fr: "« Au marché, 6 mères sur 10 demandent du savon aux voisines avant de rentrer. »"
    en: "\"At the market, 6 mothers out of 10 ask neighbours for soap before going home.\""
- id: m.observe_desire
  title:
    fr: "Observer l'envie en vrai"
    en: "Observe the desire for real"
  objective:
    fr: "Voir où et comment les gens se font ce plaisir aujourd'hui."
    en: "See where and how people treat themselves today."
  instructions:
    - fr: "Va là où les gens achètent ce plaisir (pâtisserie, marché, salon de coiffure, boutique…)."
      en: "Go where people buy this treat (pastry shop, market, hair salon, shop…)."
    - fr: "Observe pendant 20 minutes, sans rien vendre."
      en: "Watch for 20 minutes without selling anything."
    - fr: "Note ce qu'ils choisissent, combien ils paient, ce qui les fait sourire ou hésiter. Pas de nom, pas de numéro de téléphone."
      en: "Note what they choose, how much they pay, what makes them smile or hesitate. No names, no phone numbers."
  deliverable:
    fr: "Ce que tu as vu, en deux ou trois phrases."
    en: "What you saw, in two or three sentences."
  duration_minutes: 30
  difficulty: 1
  example:
    fr: "« À la pâtisserie, 8 clients sur 10 achètent pour une fête ; les gâteaux décorés partent en premier. » (Exemple inventé.)"
    en: "\"At the pastry shop, 8 customers out of 10 buy for a celebration; decorated cakes go first.\" (Invented example.)"
- id: m.talk_three
  title:
    fr: "Parler à trois personnes concernées"
    en: "Talk to three people concerned"
  objective:
    fr: "Comprendre comment trois personnes vivent le problème ou l'envie, sans leur vendre ton idée."
    en: "Understand how three people live with the problem or the desire, without selling them your idea."
  instructions:
    - fr: "Choisis trois personnes qui correspondent à ton client. Demande-leur si elles acceptent de parler cinq minutes."
      en: "Pick three people who match your customer. Ask if they agree to talk for five minutes."
    - fr: "Demande : « Raconte-moi la dernière fois que cela t'est arrivé. » Puis écoute."
      en: "Ask: \"Tell me about the last time this happened to you.\" Then listen."
    - fr: "Ne parle pas de ton idée avant la fin. N'enregistre personne et ne note ni nom ni numéro."
      en: "Don't mention your idea until the end. Don't record anyone and don't note names or numbers."
  deliverable:
    fr: "Pour chaque personne, une phrase sur ce qu'elle vit et ce qu'elle fait aujourd'hui."
    en: "For each person, one sentence on what they live and what they do today."
  duration_minutes: 60
  difficulty: 2
  example:
    fr: "« Personne 1 : vend au marché, achète son savon le dimanche, trouve la boutique trop loin. »"
    en: "\"Person 1: sells at the market, buys soap on Sundays, finds the shop too far.\""
- id: m.observe_competitors
  title:
    fr: "Visiter deux concurrents"
    en: "Visit two competitors"
  objective:
    fr: "Voir où tes clients achètent aujourd'hui, à quel prix et comment ils sont servis."
    en: "See where your customers buy today, at what price and how they are served."
  instructions:
    - fr: "Choisis deux endroits où tes clients règlent leur problème : une boutique, un marchand, ou ce qu'ils font sans acheter."
      en: "Pick two places where your customers deal with their problem: a shop, a seller, or what they do without buying."
    - fr: "Regarde les prix affichés ou demande-les comme un client. Observe la file, le service, ce qui manque."
      en: "Look at the displayed prices or ask like a customer. Watch the queue, the service, what is missing."
    - fr: "Ne prends pas de photo des personnes et ne note ni nom ni numéro."
      en: "Don't photograph people and don't note names or numbers."
  deliverable:
    fr: "Pour chaque endroit : le prix vu, ce qui plaît et ce qui manque."
    en: "For each place: the price seen, what people like and what is missing."
  duration_minutes: 60
  difficulty: 1
  example:
    fr: "« Boutique du centre : savon vendu à l'unité, prix affiché, fermée le dimanche, rien n'est livré. » (Exemple inventé.)"
    en: "\"Town-centre shop: soap sold by the piece, price displayed, closed on Sundays, nothing is delivered.\" (Invented example.)"
- id: m.present_offer
  title:
    fr: "Présenter ton offre à cinq personnes"
    en: "Present your offer to five people"
  objective:
    fr: "Voir comment de vrais clients réagissent à ton offre et à ton prix."
    en: "See how real customers react to your offer and your price."
  instructions:
    - fr: "Présente ton offre en une phrase, avec son prix, à cinq personnes qui correspondent à ton client."
      en: "Present your offer in one sentence, with its price, to five people who match your customer."
    - fr: "Propose-leur de commander ou de réserver. Une commande vaut plus qu'un « c'est bien »."
      en: "Offer them to order or book. An order is worth more than a \"that's nice\"."
    - fr: "N'enregistre personne et ne note ni nom ni numéro de téléphone."
      en: "Don't record anyone and don't note names or phone numbers."
  deliverable:
    fr: "Combien ont commandé ou réservé, et ce qu'ont dit les autres."
    en: "How many ordered or booked, and what the others said."
  duration_minutes: 90
  difficulty: 2
  example:
    fr: "« 2 commandes sur 5. Deux trouvent le prix trop haut, une veut une livraison le vendredi. » (Exemple inventé.)"
    en: "\"2 orders out of 5. Two find the price too high, one wants delivery on Friday.\" (Invented example.)"
- id: m.check_costs
  title:
    fr: "Demander les prix à deux fournisseurs"
    en: "Ask two suppliers for prices"
  objective:
    fr: "Remplacer les prix devinés par des prix vérifiés."
    en: "Replace guessed prices with checked ones."
  instructions:
    - fr: "Fais la liste de ce que tu dois acheter pour produire et pour commencer."
      en: "List what you must buy to produce and to start."
    - fr: "Demande le prix de chaque chose à deux fournisseurs (boutique, grossiste, marché)."
      en: "Ask two suppliers (shop, wholesaler, market) the price of each thing."
    - fr: "Note la date : les prix changent."
      en: "Note the date: prices change."
  deliverable:
    fr: "Une liste : chaque chose, les deux prix demandés, et la date."
    en: "A list: each thing, the two prices asked, and the date."
  duration_minutes: 60
  difficulty: 1
  example:
    fr: "« Huile, 1 litre : grossiste du port et marché du Bazary Be, prix notés le 3 mars. » (Exemple inventé.)"
    en: "\"Oil, 1 litre: port wholesaler and Bazary Be market, prices noted on 3 March.\" (Invented example.)"
- id: m.pre_sell
  title:
    fr: "Prévendre à dix personnes"
    en: "Pre-sell to ten people"
  objective:
    fr: "Savoir combien de clients paient ou réservent vraiment à ton prix."
    en: "Find out how many customers really pay or book at your price."
  instructions:
    - fr: "Avant de commencer, écris combien de réservations il faut pour que le test soit réussi."
      en: "Before starting, write how many bookings are needed for the test to succeed."
    - fr: "Présente ton offre et ton prix à dix personnes qui correspondent à ton client, et propose de réserver avec une petite avance."
      en: "Present your offer and price to ten people who match your customer, and offer to book with a small deposit."
    - fr: "Note chaque avance reçue. Ne note ni nom ni numéro de téléphone ; un surnom suffit pour livrer."
      en: "Record each deposit received. Don't note names or phone numbers; a nickname is enough to deliver."
  deliverable:
    fr: "Le nombre de réservations sur dix, et ce qu'ont dit ceux qui ont refusé."
    en: "The number of bookings out of ten, and what those who refused said."
  duration_minutes: 120
  difficulty: 2
  example:
    fr: "« 5 réservations sur 10. Trois trouvent le prix juste, deux veulent payer à la livraison. » (Exemple inventé.)"
    en: "\"5 bookings out of 10. Three find the price fair, two want to pay on delivery.\" (Invented example.)"
- id: m.launch_week
  title:
    fr: "Vendre pendant une semaine"
    en: "Sell for one week"
  objective:
    fr: "Faire tes premières vraies ventes et apprendre de chacune."
    en: "Make your first real sales and learn from each one."
  instructions:
    - fr: "Suis les premières étapes de ton plan de lancement."
      en: "Follow the first steps of your launch plan."
    - fr: "Chaque soir, note les ventes du jour, l'argent reçu et ce que tu as dépensé."
      en: "Every evening, write down the day's sales, the money received and what you spent."
    - fr: "Note aussi ce que les clients ont demandé ou reproché, sans nom ni numéro."
      en: "Also note what customers asked for or complained about, without names or numbers."
  deliverable:
    fr: "Le total de la semaine (ventes, argent reçu, dépenses) et deux choses apprises."
    en: "The week's totals (sales, money received, spending) and two things learned."
  duration_minutes: 420
  difficulty: 3
  example:
    fr: "« 18 lots vendus, tout payé ; une cliente veut un parfum citron. » (Exemple inventé.)"
    en: "\"18 packs sold, all paid; one customer wants a lemon scent.\" (Invented example.)"
- id: m.observation_walk
  title:
    fr: "Une promenade pour observer"
    en: "A walk to observe"
  objective:
    fr: "Repérer cinq petits problèmes que les gens vivent autour de toi."
    en: "Spot five small problems people live with around you."
  instructions:
    - fr: "Marche 30 minutes dans ton quartier, au marché ou à un arrêt de taxi-be."
      en: "Walk for 30 minutes in your neighbourhood, at the market or at a minibus stop."
    - fr: "Cherche les plaintes, les files d'attente, les longs trajets et les solutions bricolées."
      en: "Look for complaints, queues, long trips and improvised fixes."
    - fr: "Note ce que tu vois, sans nom, sans numéro et sans photo de visage."
      en: "Write what you see, without names, numbers or photos of faces."
  deliverable:
    fr: "Cinq problèmes observés, chacun en une phrase."
    en: "Five problems observed, one sentence each."
  duration_minutes: 30
  difficulty: 1
  example:
    fr: "« Arrêt de taxi-be : 20 minutes d'attente sous la pluie, aucun abri. » (Exemple inventé.)"
    en: "\"Minibus stop: 20 minutes waiting in the rain, no shelter.\" (Invented example.)"
