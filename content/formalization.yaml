# Regulatory content for the "Préparation administrative" tool (Phase 8,
# CLAUDE.md §18–§19). RULES FOR AUTHORS:
# - every fact, document and fee names an OFFICIAL source actually read,
#   with the place in it (page, article); the build refuses anything else;
# - "advice" is Eripoo's own guidance and must never state a rule;
# - nothing is added from secondary sites (they contradict each other);
# - after review_after, the app says the information may be out of date;
# - legal_review stays "pending" until a Malagasy lawyer has read it.
# The French follows the source wording; mg and en are drafts.
review_after: "2027-01-08"
legal_review: pending

