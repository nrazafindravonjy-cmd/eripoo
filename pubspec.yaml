name: eripoo
description: "Eripoo — Mihary ho an'ny ho avy."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  sodium: ^4.1.1+2
  sqlite3: ^3.7.0
  supabase_flutter: ^2.18.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true

# Native build hooks configuration.
hooks:
  user_defines:
    sqlite3:
      # SQLite3MultipleCiphers: page-level encryption of the local database
      # (docs/SECURITY.md §4.5, §18.2). MIT licence, verified on v2.5.0.
      source: sqlite3mc
