name: Release

# Signed App Bundle for Google Play (docs/RELEASE_CHECKLIST.md §3).
# Manual: Actions > Release > Run workflow. Runs in the protected
# "production" environment (required reviewers set by the owner), whose
# secrets hold the upload key; nothing secret is written to Git.
#
# Environment secrets:
#   PLAY_UPLOAD_KEYSTORE_BASE64  the upload keystore (.jks), base64
#   PLAY_UPLOAD_STORE_PASSWORD   its store password
#   PLAY_UPLOAD_KEY_ALIAS        the key alias
#   PLAY_UPLOAD_KEY_PASSWORD     the key password
#   RELEASE_ARCHIVE_PASSPHRASE   encrypts the bundle and the symbols before
#                                upload (artifacts of a public repository
#                                can be downloaded by any GitHub user)
#   PROD_SUPABASE_URL, PROD_SUPABASE_ANON_KEY  optional: without them the
#                                build has no backend (offline, guest only);
#                                the production project is not created yet.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  bundle:
    name: Signed App Bundle
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Required secrets are present
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PASSPHRASE: ${{ secrets.RELEASE_ARCHIVE_PASSPHRASE }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name" >&2; exit 1; fi
          done
      - name: Upload key (outside Git, removed at the end)
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      # Public values only (URL and anon key), in an ignored file.
      - name: Write env/production.json
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            case "$SUPABASE_URL" in https://*) ;; *) echo "PROD_SUPABASE_URL must be https" >&2; exit 1 ;; esac
          else
            echo "::warning::No production backend: the build is offline (guest only)."
          fi
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{ERIPOO_ENV: "production", SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env/production.json
      - run: flutter pub get
      - run: dart run build_runner build
      - name: App Bundle (obfuscated, symbols kept apart)
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define-from-file=env/production.json
      # Same code and configuration, one APK per ABI, for the release
      # checks (permissions, clear text, backup, debuggable, size budget).
      - name: Release APKs for the checks (arm64, armv7)
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 --obfuscate \
            --split-debug-info=build/symbols-apk \
            --dart-define-from-file=env/production.json
          for abi in armeabi-v7a arm64-v8a; do
            tool/check_apk.sh build/app/outputs/flutter-apk/app-$abi-release.apk
          done
      - name: Signed with the upload key, not the debug key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "Signed with the debug key" >&2; exit 1
          fi
      - name: Encrypt the bundle and the symbols
        env:
          PASSPHRASE: ${{ secrets.RELEASE_ARCHIVE_PASSPHRASE }}
        run: |
          mkdir -p release
          cp build/app/outputs/bundle/release/app-release.aab release/
          tar -czf release/symbols.tar.gz -C build symbols
          sha256sum release/app-release.aab | tee release/app-release.aab.sha256
          tar -cf release.tar -C release .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o eripoo-release.tar.gpg release.tar
      - uses: actions/upload-artifact@v4
        with:
          name: eripoo-release-encrypted
          path: eripoo-release.tar.gpg
          retention-days: 7
      - name: Remove the key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
