name: CI

# Actions minutes are limited: documentation-only changes run nothing, a
# new push cancels the older run of the same PR, and the Android jobs
# (≈ 70 runner-minutes) run only on demand (Actions > CI > Run workflow).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generate code
        run: dart run build_runner build
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - run: flutter analyze
      - name: Content pack (parse, validate, built from content/)
        run: dart run tool/content_build.dart --check
      - run: flutter test

  android-build:
    name: Android debug build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug
      - name: Show the produced APK (proof that it exists)
        run: |
          ls -l build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eripoo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # Phase 2 foundations on Android emulators (not a substitute for the
  # reference phones A and B: emulator timings are only indicative).
  # A recent Android with 2 GB and an old one with 1 GB of RAM.
  android-emulator:
    name: Android emulator (API ${{ matrix.api }}, ${{ matrix.ram }})
    runs-on: ubuntu-latest
    needs: android-build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Budgets (docs/PERFORMANCE.md): generous on shared CI machines,
          # to catch regressions, not to measure (phones A and B do that).
          - api: 34
            ram: 2048M
            target: google_apis
            start_budget: 12000
            pss_budget: 204800
          - api: 26
            ram: 1024M
            target: default
            start_budget: 2500
            pss_budget: 153600
    steps:
      - uses: actions/checkout@v4
      # The emulator's data partition needs several GB; the runner's disk
      # is mostly taken by preinstalled toolchains Eripoo does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      # Gradle (8 GB heap in gradle.properties) and the emulator together
      # exhausted the runner, which was shut down mid-build: cap Gradle here,
      # build everything before the emulator starts, then stop Gradle.
      - name: Cap Gradle memory for this job
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
      - name: Release APK for start-up measurements (x86_64, AOT)
        run: flutter build apk --release --target-platform android-x64
      - name: Release APK checks (permissions, clear text, size budget)
        run: tool/check_apk.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Debug APK of the integration test (built before the emulator)
        run: |
          mkdir -p build/release-apk
          cp build/app/outputs/flutter-apk/app-release.apk build/release-apk/
          flutter build apk --debug --target-platform android-x64 -t integration_test/foundations_test.dart
          (cd android && ./gradlew --stop)
      - name: Foundations on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          COLD_START_BUDGET_MS: ${{ matrix.start_budget }}
          PSS_BUDGET_KIB: ${{ matrix.pss_budget }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: ${{ matrix.ram }}
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: tool/ci_emulator_run.sh
      - name: Measurements
        if: always()
        run: grep -h MEASURE cold_start.txt foundations.txt || true

  # SQL tests on plain PostgreSQL with a minimal auth stub (partial).
  database-stub:
    name: Database tests (PostgreSQL + auth stub)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run_local.sh --stub

  # Real local Supabase stack (Postgres, Auth, PostgREST): same SQL tests,
  # then the client contract tests over HTTP (test/contract/).
  database-supabase:
    name: Supabase local (SQL + RPC contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned: resolving "latest" calls the GitHub API, whose rate limit
      # failed a run before any test (2026-10-07). Last version seen green.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase --version
      - run: supabase start
      - run: supabase db reset
      - name: SQL tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: supabase/tests/run_local.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: RPC contract tests against Supabase
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          export ERIPOO_TEST_SUPABASE_URL="$API_URL"
          export ERIPOO_TEST_SUPABASE_ANON_KEY="$ANON_KEY"
          flutter test --tags supabase test/contract/supabase_remote_contract_test.dart
